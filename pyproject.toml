[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moelora-repro"
version = "0.1.0"
description = "LLM MoE-LoRA reproduction with supporting synthetic mechanism experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "matplotlib>=3.7"]

[project.optional-dependencies]
scienceqa = [
  "transformers>=4.45,<5",
  "datasets>=2.20",
  "accelerate>=0.26",
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.scripts]
moelora-run = "moelora_repro.run:main"

[tool.setuptools]
packages = ["moelora_repro", "moelora_repro.scienceqa", "moelora_synthetic"]
include-package-data = false

[tool.setuptools.package-dir]
moelora_repro = "src/moelora_repro"
moelora_synthetic = "experiments/synthetic"
