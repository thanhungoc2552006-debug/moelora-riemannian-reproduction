name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .
      - name: Run mechanism and workflow tests
        run: python -m unittest discover -s tests -v
      - name: Run a small synthetic sweep
        run: python -m moelora_repro.run --config configs/synthetic/smoke.json
